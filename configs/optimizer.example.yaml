schema_version: 1
generator:
  provider: chat_completions
  base_url: http://localhost:8000/v1
  model: YOUR_MODEL_NAME
  api_key_env: KAI_PICHU_API_KEY  # Must be set before a live run; use "" for a keyless local endpoint.
  max_tokens: 262144
  temperature: 0.2
  timeout_seconds: 120
# judge:  # Omit to use the generator's model configuration.
#   provider: chat_completions
#   base_url: http://localhost:8000/v1
#   model: YOUR_JUDGE_MODEL
#   api_key_env: KAI_PICHU_API_KEY
budget:
  rounds: 10
  llm_calls: 30
  seconds: 3600
  evaluation_seconds: 300
  acceptance_repeats: 2
resources:
  gpu_policy: exclusive
  poll_seconds: 1
# gpu_device: 0  # Under resources, set for GPU-backed external-process adapters.
profile:
  enabled: false
  ncu: ncu
  # report_reader: /path/to/report-reader
  sections:
    - SpeedOfLight
    - LaunchStats
    - Occupancy
    - MemoryWorkloadAnalysis
    - SchedulerStats
    - WarpStateStats
    - ComputeWorkloadAnalysis
    - InstructionStats
    - SourceCounters
  # metrics: [gpu__time_duration.sum]  # Explicit metrics override sections.
  # ncu_report_dir: /path/to/nsight-compute/extras/python
  query_rounds: 4  # Maximum evidence exchanges per diagnosis; the judge may stop earlier.
  queries_per_round: 3
  query_seconds: 60
  max_rows: 30
  max_result_chars: 16000
  # case_id: original_seed0
max_context_chars: 120000
