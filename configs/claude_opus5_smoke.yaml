schema_version: 1
coder:
  provider: anthropic          # Official Anthropic SDK; install with: pip install 'kai-pichu[anthropic]'
  model: claude-opus-5
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 262144
  timeout_seconds: 600         # Thinking models can take minutes on hard rounds.
  extra_body:
    output_config:
      effort: high             # low | medium | high | xhigh | max; thinking is adaptive by default.
# judge:  # Omit to reuse the coder. A cheaper judge could be claude-sonnet-5.
budget:
  rounds: 3
  llm_calls: 9
  seconds: 1800
  evaluation_seconds: 300
  acceptance_repeats: 2
resources:
  gpu_policy: exclusive
  poll_seconds: 1
profile:
  enabled: true
  ncu: ncu
  query_rounds: 4
max_context_chars: 160000
