<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="724" viewBox="0 0 1280 724" role="img" aria-labelledby="title desc">
<title id="title">KAI Core Agent — CUDA kernel engineering workflow</title>
<desc id="desc">You define an operator, reference and objective, models, GPU and budget. Following baseline preflight, the agent generates and evaluates CUDA candidates. Failures trigger diagnosis and repair; valid candidates feed performance diagnosis with optional NCU evidence and another revision. After search, the best eligible candidate receives repeated acceptance checks. A shared artifacts panel distinguishes conditionally accepted source from the code, diagnostics and measurements recorded across attempts.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#89969e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="repair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a75b12" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="opt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#087f76" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="lift" x="-12%" y="-24%" width="124%" height="158%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#20282e" flood-opacity=".055"/></filter>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#20282e;font-size:24px}
.muted{fill:#56636b}.node{font-size:28px;font-weight:650}.heading{font-size:36px;font-weight:650}
.edge{fill:none;stroke:#89969e;stroke-width:2.4;stroke-linejoin:round;marker-end:url(#arrow)}
.mono{font-family:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace}
.card{fill:#ffffff;stroke:#20282e;stroke-opacity:.07;stroke-width:1;filter:url(#lift)}
.chip{fill:#eef2f3}.chip-text{fill:#56636b}
.flow{fill:none;stroke:#65747e;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:8 16;animation:flow 2.4s linear 2}
.flow.teal{stroke:#087f76}
@keyframes flow{to{stroke-dashoffset:-24}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
</defs>
<rect width="1280" height="724" rx="24" fill="#fdfefe"/>
<text x="40" y="57" class="heading">The CUDA kernel engineering loop</text>
<!-- One continuous workspace. Inputs, engineering and artifacts share its grid. -->
<rect x="40" y="90" width="1200" height="606" rx="24" fill="#fbfcfd"/>
<path d="M40 190H1240" stroke="#20282e" stroke-opacity=".065"/>
<text x="64" y="123" class="muted">You define</text>
<path d="M432 115V171M862 115V171" stroke="#20282e" stroke-opacity=".065"/>
<text x="64" y="161" class="node">Operator specification</text>
<text x="456" y="161" class="node">Reference + objective</text>
<text x="886" y="161" class="node">Models + GPU + budget</text>

<path d="M88 190V254Q88 270 104 270H140Q156 270 156 286V310" class="edge"/>
<text x="108" y="228" class="muted">Baseline preflight</text>
<!-- Orange: failed build/correctness -> focused repair. -->
<path d="M630 310V282Q630 266 614 266H222Q206 266 206 282V310" fill="none" stroke="#a75b12" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#repair)"/>
<rect x="241" y="247" width="352" height="38" rx="19" fill="#fff4e8"/>
<text x="417" y="273" text-anchor="middle" style="fill:#a75b12">Failure → diagnose + repair</text>
<rect x="72" y="310" width="270" height="116" rx="18" class="card"/>
<text x="94" y="355" class="node">Generate / revise</text>
<text x="94" y="393" class="muted"><tspan class="mono">CUDA</tspan> implementation</text>
<path d="M342 368H462" class="edge"/><path d="M342 368H453" class="flow"/>
<rect x="351" y="317" width="102" height="40" rx="20" class="chip"/><text x="402" y="345" text-anchor="middle" class="chip-text">Source</text>
<rect x="462" y="310" width="336" height="116" rx="18" class="card"/>
<text x="484" y="355" class="node">Evaluate</text>
<text x="484" y="393" class="muted">Build · correctness · timing</text>

<!-- Teal: valid candidate -> hardware-informed optimization. -->
<path d="M630 426V500" fill="none" stroke="#087f76" stroke-width="2.4" marker-end="url(#opt)"/>
<path d="M630 426V490" class="flow teal"/><rect x="649" y="440" width="78" height="38" rx="19" fill="#edf8f5"/><text x="688" y="467" text-anchor="middle" style="fill:#087f76">Valid</text>
<rect x="440" y="500" width="358" height="100" rx="18" fill="#edf8f5" stroke="#087f76" stroke-opacity=".09" filter="url(#lift)"/>
<text x="462" y="541" class="node">Diagnose performance</text>
<text x="462" y="577" class="muted">Metrics + optional <tspan class="mono">NCU</tspan></text>
<path d="M440 550H222Q206 550 206 534V426" fill="none" stroke="#087f76" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#opt)"/>
<path d="M440 550H222Q206 550 206 534V436" class="flow teal"/><rect x="239" y="505" width="164" height="38" rx="19" fill="#edf8f5"/><text x="321" y="532" text-anchor="middle" style="fill:#087f76">Next change</text>

<!-- Final recheck is an action; its source output is an artifact, not a review step. -->
<path d="M798 368H924" class="edge"/><path d="M798 368H914" class="flow"/><rect x="807" y="293" width="108" height="64" rx="20" class="chip"/>
<text x="861" y="319" text-anchor="middle" class="muted">After</text>
<text x="861" y="346" text-anchor="middle" class="muted">search</text>
<rect x="924" y="310" width="292" height="116" rx="18" class="card"/>
<text x="946" y="355" class="node">Recheck best</text>
<text x="946" y="393" class="muted">Acceptance repeats</text>
<path d="M1070 426V478" class="edge"/>

<!-- One artifact container, with separate conditional and unconditional paths. -->
<rect x="924" y="478" width="292" height="194" rx="18" fill="#f1f5f5"/>
<text x="946" y="516" class="node">Accepted source</text>
<text x="946" y="547" class="muted">If all rechecks pass</text>
<path d="M946 565H1194" stroke="#20282e" stroke-opacity=".08"/>
<text x="946" y="601" class="node">Run records</text>
<text x="946" y="632" class="muted">Code + diagnostics</text>
<text x="946" y="658" class="muted">Accepted or not</text>
<path d="M798 408H834Q850 408 850 424V599Q850 615 866 615H924" fill="none" stroke="#89969e" stroke-width="2" stroke-dasharray="5 7" stroke-linejoin="round"/>
<circle cx="798" cy="408" r="4" fill="#89969e"/>
<rect x="807" y="433" width="110" height="64" rx="20" class="chip"/><text x="862" y="459" text-anchor="middle" class="chip-text">Every</text><text x="862" y="486" text-anchor="middle" class="chip-text">attempt</text>
</svg>
