# Outer-event timing boundary, kept for comparison with benchmark-graph-events.yaml.
# latency_ms is measured from the host around the graph replay and includes submission
# gaps, which are noise for a single operator and can prevent A/A calibration from passing.
# For optimizing this single operator, use benchmark-graph-events.yaml.
schema_version: 1
name: layernorm_fwd_1024_graph_v2
description: FP32 LayerNorm forward, 16384 rows by 1024 columns,
  including z, mean and reciprocal standard deviation.
adapter: adapter.py:LayerNorm
implementation:
  root: baseline
  files:
  - solution.cu
benchmark_files:
- bridge.cu
- upstream/*.*
- upstream/layer_norm/*
objective:
  metric: latency_ms
  unit: ms
  direction: minimize
  scope: kernel
  max_case_regression: 0.01
measurement:
  timer: cuda_event
  device: 0
  warmup: 5
  blocks: 40
  iterations: 5
  confidence: 0.95
  bootstrap_samples: 5000
  calibration_tolerance: 0.005
  boundary: One CUDA Graph replay containing exactly one native LayerNorm operator
    on the measured PyTorch stream, identical capture protocol for both arms. CUDA
    events include graph replay on the GPU; native CPU configuration, capture, input/output
    allocation, reset and validation are excluded.
  cache_policy: Before every invocation, poison outputs and write a separate 256 MiB
    buffer, following the original benchmark's L2-thrashing policy. Input buffers
    are reused. No profiler or clock locking.
seed: 0
options:
  device: cuda:0
  nvcc: nvcc
  cuda_arch: sm_120
  compile_timeout_seconds: 300
  execution: graph
